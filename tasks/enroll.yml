---
- name: Create the swtpm socket directory
  ansible.builtin.file:
    path: "{{ vault_tpm_device_path | dirname }}"
    state: directory
    owner: "{{ vault_tpm_proxy_user }}"
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0750"
  become: true
  when:
    - vault_tpm_install_swtpm | bool
    - vault_tpm_device_path is not match('^/dev/')

- name: Install the swtpm unit
  ansible.builtin.template:
    src: swtpm.service.j2
    dest: /etc/systemd/system/swtpm.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Restart swtpm
    - Restart vault proxy
  when: vault_tpm_install_swtpm | bool

- name: Enable and start swtpm
  ansible.builtin.systemd_service:
    name: swtpm
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: vault_tpm_install_swtpm | bool

- name: Enroll the host TPM
  ansible.builtin.command:
    argv: "{{ [vault_tpm_bin_path, 'tpm', 'enroll', '-name=' ~ vault_tpm_enroll_name, '-tpm-device-path=' ~ vault_tpm_device_path] + _metadata_flags }}"
  vars:
    _metadata_flags: >-
      {{
        (
          vault_tpm_enroll_metadata.keys() | list
          | zip(vault_tpm_enroll_metadata.values() | map('string') | list)
        )
        | map('join', '=')
        | map('regex_replace', '^', '-metadata=')
        | list
      }}
    _enroll_env: >-
      {{
        {
          'VAULT_ADDR': vault_tpm_proxy_addr,
          'VAULT_CACERT': vault_tpm_ca_cert_dest,
          'VAULT_TOKEN': vault_tpm_effective_token
        }
        | combine({'VAULT_NAMESPACE': vault_tpm_namespace} if (vault_tpm_namespace | length > 0) else {})
      }}
  become: true
  become_user: "{{ vault_tpm_proxy_user }}"
  environment: "{{ _enroll_env }}"
  no_log: true
  register: vault_tpm_enroll
  changed_when:
    - vault_tpm_enroll.rc == 0
  failed_when:
    - vault_tpm_enroll.rc != 0
    - (vault_tpm_enroll.stdout | default('') ~ (vault_tpm_enroll.stderr | default(''))) is not search('(?i)already')
