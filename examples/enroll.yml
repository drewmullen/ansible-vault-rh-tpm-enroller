---
# Policies named in vault_tpm_token_policies must already exist.
# Enable auth/tpm and write auth/<mount>/config before this play.
#
# ansible-playbook -i examples/inventory.yml examples/enroll.yml
- name: Enroll application hosts and install Vault Proxy
  hosts: app_hosts
  gather_facts: true
  become: true
  roles:
    - role: vault_tpm_enroll
    - role: vault_tpm_proxy
