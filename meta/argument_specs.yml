---
argument_specs:
  main:
    short_description: Enroll a host TPM and run Vault Proxy
    description:
      - Enrolls a host TPM with Vault Enterprise TPM auth and installs Vault Proxy.
      - Fails before it changes anything when the API address, an admin credential, the role name, a policy source, or the Vault CA is missing.
      - See ansible-vault-tpm-modules.md for the full rationale.
    options:
      vault_tpm_api_addr:
        type: str
        required: false
        description:
          - Vault address the controller uses to enable auth and write the role.
          - Defaults to VAULT_ADDR. Required at runtime, and it must start with https://.
      vault_tpm_token:
        type: str
        required: false
        no_log: true
        description:
          - Admin token for Vault API calls and for vault tpm enroll.
          - Defaults to VAULT_TOKEN. Required unless both vault_tpm_role_id and vault_tpm_secret_id are set.
      vault_tpm_role_id:
        type: str
        required: false
        description:
          - AppRole role id used when vault_tpm_token is empty.
          - Both vault_tpm_role_id and vault_tpm_secret_id are required for AppRole login.
      vault_tpm_secret_id:
        type: str
        required: false
        no_log: true
        description:
          - AppRole secret id used when vault_tpm_token is empty.
      vault_tpm_role_name:
        type: str
        required: true
        description:
          - Name of auth/<mount>/role/<name>. No default. Often set once in group vars.
      vault_tpm_policy_hcl:
        type: str
        required: false
        default: ""
        description:
          - ACL policy body. When non-empty, the role writes it with hashicorp.vault.acl_policy.
          - Required at runtime unless vault_tpm_token_policies is non-empty. The failure names both variables.
      vault_tpm_policy_name:
        type: str
        required: false
        description:
          - Name of the policy created from vault_tpm_policy_hcl.
          - Defaults to vault_tpm_role_name. Ignored when the HCL is empty.
      vault_tpm_token_policies:
        type: list
        elements: str
        required: false
        default: []
        description:
          - Names of policies that already exist in Vault.
          - Appended to the HCL policy name on the auth role.
      vault_tpm_auth_path:
        type: str
        required: false
        default: tpm
        description:
          - Auth mount path. The role enables type tpm here when the mount is absent.
      vault_tpm_auth_description:
        type: str
        required: false
        default: TPM auth
        description:
          - Description sent when the role enables the mount.
      vault_tpm_namespace:
        type: str
        required: false
        default: ""
        description:
          - Vault namespace for the mount, role, policy, and enroll command.
          - Empty leaves the root namespace.
      vault_tpm_ca_lifetime:
        type: str
        required: false
        default: 8760h
        description:
          - Lifetime of the CA created by the first write to auth/<mount>/config.
          - Attestation fails until that config exists. A later run does not rewrite it.
      vault_tpm_ca_soft_expiry:
        type: str
        required: false
        default: 720h
        description:
          - Soft expiry of the TPM auth CA, sent with the first config write.
      vault_tpm_token_ttl:
        type: str
        required: false
        default: 1h
        description:
          - TTL of tokens the auth role issues. Empty omits the field.
      vault_tpm_token_max_ttl:
        type: str
        required: false
        default: ""
        description:
          - Max TTL of issued tokens. Empty leaves Vault's mount default.
      vault_tpm_token_period:
        type: str
        required: false
        default: ""
        description:
          - Period of issued tokens. Empty leaves the field unset.
      vault_tpm_token_type:
        type: str
        required: false
        default: ""
        description:
          - service, batch, or default. Empty leaves Vault's default.
      vault_tpm_token_no_default_policy:
        type: bool
        required: false
        default: false
        description:
          - When true, issued tokens do not receive the default policy.
      vault_tpm_token_bound_cidrs:
        type: list
        elements: str
        required: false
        default: []
        description:
          - CIDRs that issued tokens are bound to. Empty omits the field.
      vault_tpm_role_config:
        type: dict
        required: false
        default: {}
        description:
          - Extra keys merged on top of the auth role body, including TPM-specific role fields.
      vault_tpm_enroll_name:
        type: str
        required: false
        description:
          - TPM identity name passed to vault tpm enroll.
          - Defaults to inventory_hostname. Unique per TPM. Override in host vars.
      vault_tpm_device_path:
        type: str
        required: false
        default: /dev/tpmrm0
        description:
          - TPM device path, or a swtpm socket path.
      vault_tpm_enroll_metadata:
        type: dict
        required: false
        default: {}
        description:
          - Key-value metadata passed as repeated -metadata=key=value flags.
      vault_tpm_proxy_addr:
        type: str
        required: false
        description:
          - Vault address the managed node uses for enroll and the proxy config.
          - Defaults to vault_tpm_api_addr.
      vault_tpm_proxy_user:
        type: str
        required: false
        default: vault-proxy
        description:
          - Unix account that owns the proxy socket, config, and enrollment.
      vault_tpm_proxy_config_path:
        type: str
        required: false
        default: /etc/vault-proxy/tpm.hcl
        description:
          - Path of the proxy HCL file.
      vault_tpm_ca_cert:
        type: str
        required: false
        default: ""
        description:
          - Vault CA certificate PEM text.
          - Required at runtime unless vault_tpm_ca_cert_src is set.
      vault_tpm_ca_cert_src:
        type: str
        required: false
        default: ""
        description:
          - Path on the controller of the Vault CA certificate file.
      vault_tpm_ca_cert_dest:
        type: str
        required: false
        default: /etc/vault-proxy/ca.pem
        description:
          - Path of the CA file on the managed node. Mode 0644.
      vault_tpm_cert_dir:
        type: str
        required: false
        description:
          - tpm_cert destination directory.
          - Defaults to /var/lib/vault-proxy/<vault_tpm_proxy_user>/tpm.
      vault_tpm_cert_name:
        type: str
        required: false
        default: host_identity
        description:
          - Label of the tpm_cert block.
      vault_tpm_csr_cn:
        type: str
        required: false
        description:
          - CSR common name. Defaults to vault_tpm_enroll_name.
      vault_tpm_renew_percent:
        type: int
        required: false
        default: 20
        description:
          - Renew when this percent of the certificate lifetime remains.
      vault_tpm_renew_min_backoff:
        type: str
        required: false
        default: 5s
        description:
          - Minimum renew backoff.
      vault_tpm_renew_max_backoff:
        type: str
        required: false
        default: 5m
        description:
          - Maximum renew backoff.
      vault_tpm_use_auto_auth_token:
        type: str
        required: false
        default: force
        description:
          - api_proxy use_auto_auth_token value.
      vault_tpm_socket_dir:
        type: str
        required: false
        default: /run/vault-proxy
        description:
          - Directory of the proxy Unix socket. The socket file is <dir>/<user>.sock.
      vault_tpm_socket_mode:
        type: str
        required: false
        default: "600"
        description:
          - Mode of the proxy Unix socket.
      vault_tpm_proxy_config:
        type: str
        required: false
        default: ""
        description:
          - Full proxy HCL. When non-empty, it replaces the generated file.
      vault_tpm_service_name:
        type: str
        required: false
        default: vault-proxy
        description:
          - systemd unit name for Vault Proxy.
      vault_tpm_service_enabled:
        type: bool
        required: false
        default: true
        description:
          - Whether the proxy unit is enabled.
      vault_tpm_service_state:
        type: str
        required: false
        default: started
        description:
          - systemd state for the proxy unit.
      vault_tpm_packages:
        type: list
        elements: str
        required: false
        default:
          - tpm2-tss
          - tpm2-tools
        description:
          - Packages installed on the host. An empty list installs nothing.
      vault_tpm_install_swtpm:
        type: bool
        required: false
        default: false
        description:
          - Install and start swtpm, listening on vault_tpm_device_path, before enroll.
      vault_tpm_version:
        type: str
        required: false
        default: ""
        description:
          - Vault version to download and install at vault_tpm_bin_path.
          - Empty means the vault binary is already on the host.
      vault_tpm_bin_path:
        type: str
        required: false
        default: /usr/local/bin/vault
        description:
          - Path of the vault binary used for enroll, the proxy, and the optional verify read.
      vault_tpm_verify_path:
        type: str
        required: false
        default: ""
        description:
          - When non-empty, read this path through the proxy socket with VAULT_TOKEN unset.
          - The role does not write that secret.
