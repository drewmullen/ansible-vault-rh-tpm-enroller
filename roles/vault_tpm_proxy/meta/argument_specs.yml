---
argument_specs:
  main:
    short_description: Install Vault Proxy with TPM auto-auth
    description:
      - Creates the proxy user, writes the TPM proxy config, and enables the systemd unit.
      - Assumes the TPM auth mount, auth CA, policies, and auth role already exist.
    options:
      vault_tpm_proxy_addr:
        type: str
        required: false
        description:
          - Vault address the proxy uses. Must start with https://.
          - Defaults to vault_tpm_api_addr, then VAULT_ADDR.
      vault_tpm_role_name:
        type: str
        required: true
        description:
          - TPM auth role the proxy logs in as.
      vault_tpm_auth_path:
        type: str
        required: false
        default: tpm
        description:
          - TPM auth mount path.
      vault_tpm_namespace:
        type: str
        required: false
        default: ""
        description:
          - Vault namespace written into the proxy vault block. Empty leaves the root namespace.
      vault_tpm_proxy_user:
        type: str
        required: false
        default: vault-proxy
        description:
          - Unix account that runs the proxy.
      vault_tpm_proxy_config_path:
        type: str
        required: false
        default: /etc/vault-proxy/tpm.hcl
        description:
          - Path of the proxy HCL file.
      vault_tpm_ca_cert:
        type: str
        required: false
        default: ""
        description:
          - Vault CA PEM text. Required unless vault_tpm_ca_cert_src is set.
      vault_tpm_ca_cert_src:
        type: str
        required: false
        default: ""
        description:
          - Path of the Vault CA file on the controller.
      vault_tpm_ca_cert_dest:
        type: str
        required: false
        default: /etc/vault-proxy/ca.pem
        description:
          - Path of the CA file on the host.
      vault_tpm_device_path:
        type: str
        required: false
        default: /dev/tpmrm0
        description:
          - TPM device the proxy attests with.
          - A /dev/tpm path or a path outside /dev adds the user to group tss.
      vault_tpm_cert_dir:
        type: str
        required: false
        description:
          - Directory where the proxy writes the TPM certificate. Defaults to /var/lib/vault-proxy/<user>/tpm.
      vault_tpm_enroll_name:
        type: str
        required: false
        description:
          - Name used as the default CSR common name. Defaults to inventory_hostname.
      vault_tpm_cert_name:
        type: str
        required: false
        default: host_identity
        description:
          - Label of the tpm_cert block.
      vault_tpm_csr_cn:
        type: str
        required: false
        description:
          - CSR common name. Defaults to vault_tpm_enroll_name, which defaults to inventory_hostname.
      vault_tpm_renew_percent:
        type: int
        required: false
        default: 20
        description:
          - Percent of the certificate lifetime remaining when renewal starts.
      vault_tpm_renew_min_backoff:
        type: str
        required: false
        default: 5s
        description:
          - Minimum delay between certificate renewal attempts.
      vault_tpm_renew_max_backoff:
        type: str
        required: false
        default: 5m
        description:
          - Maximum delay between certificate renewal attempts.
      vault_tpm_use_auto_auth_token:
        type: str
        required: false
        default: force
        description:
          - api_proxy use_auto_auth_token value.
      vault_tpm_socket_dir:
        type: str
        required: false
        default: /run/vault-proxy
        description:
          - Directory of the proxy unix socket. The unit creates it on start.
      vault_tpm_socket_mode:
        type: str
        required: false
        default: "600"
        description:
          - Mode of the proxy unix socket. 600 allows only the proxy user to connect.
      vault_tpm_proxy_config:
        type: str
        required: false
        default: ""
        description:
          - Full proxy HCL. When set, it replaces the generated file.
      vault_tpm_verify_path:
        type: str
        required: false
        default: ""
        description:
          - When set, read this path through the proxy socket with VAULT_TOKEN unset.
      vault_tpm_version:
        type: str
        required: false
        default: ""
        description:
          - Vault version to install. Empty requires a binary at vault_tpm_bin_path.
      vault_tpm_bin_path:
        type: str
        required: false
        default: /usr/local/bin/vault
        description:
          - Path of the vault binary.
      vault_tpm_service_name:
        type: str
        required: false
        default: vault-proxy
        description:
          - systemd unit name.
      vault_tpm_service_enabled:
        type: bool
        required: false
        default: true
        description:
          - Whether the unit is enabled.
      vault_tpm_service_state:
        type: str
        required: false
        default: started
        description:
          - systemd state for the unit.
