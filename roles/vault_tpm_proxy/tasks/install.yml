---
- name: Install tpm2-tss so the proxy user can join group tss
  ansible.builtin.package:
    name: tpm2-tss
    state: present
  become: true

- name: Install the Vault binary
  ansible.builtin.import_role:
    name: vault_tpm_common
    tasks_from: install_vault.yml
  vars:
    vault_tpm_binary_action: starting the proxy
