---
- name: Require a supported host
  ansible.builtin.import_role:
    name: vault_tpm_common
    tasks_from: require_host.yml
  vars:
    vault_tpm_component: vault_tpm_proxy

- name: Fail when required inputs are missing
  ansible.builtin.fail:
    msg: "Missing required variables: {{ vault_tpm_missing_inputs | join('; ') }}."
  vars:
    _has_ca: "{{ (vault_tpm_ca_cert | default('') | length > 0) or (vault_tpm_ca_cert_src | default('') | length > 0) }}"
    _missing_ca: "{{ [] if (_has_ca | bool) else ['vault_tpm_ca_cert or vault_tpm_ca_cert_src'] }}"
    vault_tpm_missing_inputs: "{{ _checked + _missing_ca }}"
    _checked: >-
      {{
        [
          {'label': 'vault_tpm_proxy_addr', 'value': vault_tpm_proxy_addr | default(''), 'https': true},
          {'label': 'vault_tpm_role_name', 'value': vault_tpm_role_name | default('')}
        ] | vault_tpm_missing
      }}
  when: vault_tpm_missing_inputs | length > 0
