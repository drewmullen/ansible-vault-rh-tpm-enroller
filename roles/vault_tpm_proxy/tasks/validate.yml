---
- name: Require gathered facts
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_architecture is defined
    fail_msg: >-
      Gather facts before vault_tpm_proxy.
      The role needs ansible_os_family and ansible_architecture.

- name: Require a Red Hat family host
  ansible.builtin.fail:
    msg: >-
      vault_tpm_proxy supports the Red Hat family only
      (ansible_os_family=RedHat). This host reports {{ ansible_os_family }}.
  when: ansible_os_family != "RedHat"

- name: Record which required inputs are missing
  ansible.builtin.set_fact:
    vault_tpm_missing_inputs: "{{ _missing }}"
  vars:
    _addr: "{{ vault_tpm_proxy_addr | default('') }}"
    _missing_addr: "{{ ['vault_tpm_proxy_addr'] if (_addr | length == 0) else (['vault_tpm_proxy_addr must start with https://'] if (_addr is not match('^https://')) else []) }}"
    _missing_role: "{{ ['vault_tpm_role_name'] if (vault_tpm_role_name | default('') | length == 0) else [] }}"
    _has_ca: "{{ (vault_tpm_ca_cert | default('') | length > 0) or (vault_tpm_ca_cert_src | default('') | length > 0) }}"
    _missing_ca: "{{ [] if (_has_ca | bool) else ['vault_tpm_ca_cert or vault_tpm_ca_cert_src'] }}"
    _missing: "{{ _missing_addr + _missing_role + _missing_ca }}"

- name: Fail when required inputs are missing
  ansible.builtin.fail:
    msg: "Missing required variables: {{ vault_tpm_missing_inputs | join('; ') }}."
  when: vault_tpm_missing_inputs | length > 0
