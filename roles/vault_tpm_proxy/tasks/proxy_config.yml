---
- name: Create the proxy user
  ansible.builtin.user:
    name: "{{ vault_tpm_proxy_user }}"
    system: true
    create_home: true
    home: "/var/lib/vault-proxy/{{ vault_tpm_proxy_user }}"
    shell: /usr/sbin/nologin
    groups: "{{ 'tss' if ((vault_tpm_device_path is match('^/dev/tpm')) or (vault_tpm_device_path is not match('^/dev/'))) else omit }}"
    append: true
  become: true

- name: Create proxy config and CA directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0750"
  loop: "{{ [vault_tpm_proxy_config_path | dirname, vault_tpm_ca_cert_dest | dirname] | unique }}"
  become: true

- name: Create the TPM certificate directory
  ansible.builtin.file:
    path: "{{ vault_tpm_cert_dir }}"
    state: directory
    owner: "{{ vault_tpm_proxy_user }}"
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0750"
  become: true

- name: Install the Vault CA from content
  ansible.builtin.copy:
    content: "{{ vault_tpm_ca_cert }}"
    dest: "{{ vault_tpm_ca_cert_dest }}"
    owner: root
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0640"
  become: true
  when: vault_tpm_ca_cert | length > 0

- name: Install the Vault CA from the controller
  ansible.builtin.copy:
    src: "{{ vault_tpm_ca_cert_src }}"
    dest: "{{ vault_tpm_ca_cert_dest }}"
    owner: root
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0640"
  become: true
  when: vault_tpm_ca_cert | length == 0

- name: Write the supplied proxy config
  ansible.builtin.copy:
    content: "{{ vault_tpm_proxy_config }}"
    dest: "{{ vault_tpm_proxy_config_path }}"
    owner: root
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0640"
  become: true
  notify: Restart vault proxy
  when: vault_tpm_proxy_config | length > 0

- name: Render the proxy config
  ansible.builtin.template:
    src: tpm.hcl.j2
    dest: "{{ vault_tpm_proxy_config_path }}"
    owner: root
    group: "{{ vault_tpm_proxy_user }}"
    mode: "0640"
  become: true
  notify: Restart vault proxy
  when: vault_tpm_proxy_config | length == 0
