---
- name: Create the swtpm socket directory
  ansible.builtin.file:
    path: "{{ vault_tpm_device_path | dirname }}"
    state: directory
    owner: tss
    group: tss
    mode: "0750"
  become: true
  when:
    - vault_tpm_install_swtpm | bool
    - vault_tpm_device_path is not match('^/dev/')

- name: Install the swtpm unit
  ansible.builtin.template:
    src: swtpm.service.j2
    dest: /etc/systemd/system/swtpm.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: vault_tpm_install_swtpm | bool
  register: vault_tpm_swtpm_unit

- name: Enable and start swtpm
  ansible.builtin.systemd_service:
    name: swtpm
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (vault_tpm_swtpm_unit.changed | default(false)) else 'started' }}"
  become: true
  when: vault_tpm_install_swtpm | bool

- name: Enroll the host TPM
  hashicorp.vault.identity_tpm:
    url: "{{ vault_tpm_host_addr }}"
    ca_cert: "{{ vault_tpm_ca_cert_dest }}"
    auth_method: token
    token: "{{ vault_tpm_token }}"
    namespace: "{{ vault_tpm_namespace if (vault_tpm_namespace | length > 0) else 'root' }}"
    name: "{{ vault_tpm_enroll_name }}"
    device_path: "{{ vault_tpm_device_path }}"
    metadata: "{{ vault_tpm_enroll_metadata if (vault_tpm_enroll_metadata | length > 0) else omit }}"
    state: present
  become: true
  no_log: true
  register: vault_tpm_identity
