---
- name: Read the auth role
  ansible.builtin.uri:
    url: "{{ vault_tpm_api_addr }}/v1/auth/{{ vault_tpm_auth_path_normalized }}/role/{{ vault_tpm_role_name }}"
    method: GET
    ca_path: "{{ vault_tpm_controller_ca_path }}"
    headers: "{{ vault_tpm_api_headers }}"
    status_code:
      - 200
      - 404
    return_content: true
    timeout: 30
  register: vault_tpm_auth_role_read
  no_log: true
  delegate_to: localhost
  become: false

- name: Write the TPM auth role
  hashicorp.vault.tpm_role:
    url: "{{ vault_tpm_api_addr }}"
    ca_cert: "{{ vault_tpm_controller_ca_path }}"
    auth_method: token
    token: "{{ vault_tpm_token }}"
    namespace: "{{ vault_tpm_namespace if (vault_tpm_namespace | length > 0) else 'root' }}"
    mount: "{{ vault_tpm_auth_path_normalized }}"
    name: "{{ vault_tpm_role_name }}"
    display_name: "{{ _body.display_name | default(omit) }}"
    cert_ttl: "{{ _body.cert_ttl | default(omit) }}"
    token_policies: "{{ _body.token_policies | default(omit) }}"
    token_no_default_policy: "{{ _body.token_no_default_policy | default(omit) }}"
    token_ttl: "{{ _body.token_ttl | default(omit) }}"
    token_max_ttl: "{{ _body.token_max_ttl | default(omit) }}"
    token_period: "{{ _body.token_period | default(omit) }}"
    token_explicit_max_ttl: "{{ _body.token_explicit_max_ttl | default(omit) }}"
    token_type: "{{ _body.token_type | default(omit) }}"
    token_bound_cidrs: "{{ _body.token_bound_cidrs | default(omit) }}"
    token_num_uses: "{{ _body.token_num_uses | default(omit) }}"
    alias_metadata: "{{ _body.alias_metadata | default(omit) }}"
    tpmgroup_ids: "{{ _body.tpmgroup_ids | default(omit) }}"
    tpm_ids: "{{ _body.tpm_ids }}"
    state: present
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _existing: "{{ (vault_tpm_auth_role_read.json.data | default({})) if (vault_tpm_auth_role_read.status == 200) else {} }}"
    _play:
      token_policies: "{{ vault_tpm_effective_token_policies }}"
      token_no_default_policy: "{{ vault_tpm_token_no_default_policy | bool }}"
      token_ttl: "{{ vault_tpm_token_ttl }}"
      token_max_ttl: "{{ vault_tpm_token_max_ttl if ((vault_tpm_token_max_ttl | string | length) > 0) else none }}"
      token_period: "{{ vault_tpm_token_period if ((vault_tpm_token_period | string | length) > 0) else none }}"
      token_type: "{{ vault_tpm_token_type if ((vault_tpm_token_type | string | length) > 0) else none }}"
      token_bound_cidrs: "{{ vault_tpm_token_bound_cidrs if (vault_tpm_token_bound_cidrs | length > 0) else none }}"
    _body: "{{ _existing | vault_tpm_role_body(_play, vault_tpm_role_config, vault_tpm_identity.tpm_id) }}"
  no_log: true
  delegate_to: localhost
  become: false

- name: Confirm the auth role still includes this TPM
  ansible.builtin.uri:
    url: "{{ vault_tpm_api_addr }}/v1/auth/{{ vault_tpm_auth_path_normalized }}/role/{{ vault_tpm_role_name }}"
    method: GET
    ca_path: "{{ vault_tpm_controller_ca_path }}"
    headers: "{{ vault_tpm_api_headers }}"
    status_code:
      - 200
      - 404
    return_content: true
    timeout: 30
  register: vault_tpm_auth_role_confirm
  no_log: true
  delegate_to: localhost
  become: false

- name: Record whether the auth role kept this TPM id
  ansible.builtin.set_fact:
    vault_tpm_id_confirmed: "{{ vault_tpm_identity.tpm_id in (vault_tpm_auth_role_confirm.json.data.tpm_ids | default([])) }}"

- name: Record whether another auth role attempt is needed
  ansible.builtin.set_fact:
    vault_tpm_retry_role: "{{ (not (vault_tpm_id_confirmed | bool)) and (vault_tpm_role_attempt | int < 5) }}"
    vault_tpm_next_attempt: "{{ vault_tpm_role_attempt | int + 1 }}"

- name: Wait before appending the TPM id again
  ansible.builtin.pause:
    seconds: 2
  become: false
  when: vault_tpm_retry_role | bool

- name: Append this TPM id again
  ansible.builtin.include_tasks: auth_role_write.yml
  vars:
    vault_tpm_role_attempt: "{{ vault_tpm_next_attempt }}"
  when: vault_tpm_retry_role | bool
