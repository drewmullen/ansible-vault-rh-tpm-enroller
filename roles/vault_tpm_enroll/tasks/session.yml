---
# Controller-side login. Mount, CA config, and ACL policy are not created here.

- name: Stage Vault CA content on the controller
  when: vault_tpm_ca_cert | length > 0
  block:
    - name: Create a temporary CA file on the controller
      ansible.builtin.tempfile:
        state: file
        suffix: vault-ca.pem
      register: vault_tpm_ca_temp
      delegate_to: localhost
      become: false

    - name: Write Vault CA content on the controller
      ansible.builtin.copy:
        content: "{{ vault_tpm_ca_cert }}"
        dest: "{{ vault_tpm_ca_temp.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Record the controller CA path
  ansible.builtin.set_fact:
    vault_tpm_controller_ca_path: "{{ vault_tpm_ca_temp.path if (vault_tpm_ca_cert | length > 0) else vault_tpm_ca_cert_src }}"

- name: Read Vault health
  ansible.builtin.uri:
    url: "{{ vault_tpm_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tpm_controller_ca_path }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 501
      - 503
    return_content: true
    timeout: 30
    headers: "{{ {'X-Vault-Namespace': vault_tpm_namespace} if (vault_tpm_namespace | length > 0) else {} }}"
  register: vault_tpm_health
  delegate_to: localhost
  become: false

- name: Require Vault Enterprise 2.2 or newer
  vars:
    _raw: "{{ vault_tpm_health.json.version | default('') }}"
    _stripped: "{{ _raw | regex_replace('^v', '') }}"
    _numeric: "{{ _stripped | regex_replace('[+-].*$', '') }}"
    _parts: "{{ _numeric.split('.') }}"
    _major: "{{ _parts[0] | default('0') | int }}"
    _minor: "{{ _parts[1] | default('0') | int }}"
  ansible.builtin.assert:
    that:
      - _raw | length > 0
      - "'ent' in (_stripped | lower)"
      - (_major | int) > 2 or ((_major | int) == 2 and (_minor | int) >= 2)
    fail_msg: >-
      Vault at {{ vault_tpm_api_addr }} must be Enterprise 2.2 or newer.
      The version string must contain "ent".
      The health endpoint reported {{ _raw if (_raw | length > 0) else 'no version' }}.
