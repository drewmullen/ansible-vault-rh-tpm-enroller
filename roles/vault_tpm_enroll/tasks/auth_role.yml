---
# identity_tpm returns this host's id. tpm_role replaces the role body, so the
# id list has to include every TPM already on the role.

- name: Read the auth role
  ansible.builtin.uri:
    url: "{{ vault_tpm_api_addr }}/v1/auth/{{ vault_tpm_auth_path_normalized }}/role/{{ vault_tpm_role_name }}"
    method: GET
    ca_path: "{{ vault_tpm_controller_ca_path }}"
    headers: "{{ vault_tpm_api_headers }}"
    status_code:
      - 200
      - 404
    return_content: true
    timeout: 30
  register: vault_tpm_auth_role_read
  no_log: true
  delegate_to: localhost
  become: false

- name: Write the TPM auth role
  hashicorp.vault.tpm_role:
    url: "{{ vault_tpm_api_addr }}"
    ca_cert: "{{ vault_tpm_controller_ca_path }}"
    auth_method: token
    token: "{{ vault_tpm_effective_token }}"
    namespace: "{{ vault_tpm_namespace if (vault_tpm_namespace | length > 0) else 'root' }}"
    mount: "{{ vault_tpm_auth_path_normalized }}"
    name: "{{ vault_tpm_role_name }}"
    token_policies: "{{ vault_tpm_effective_token_policies }}"
    token_no_default_policy: "{{ vault_tpm_token_no_default_policy | bool }}"
    token_ttl: "{{ (vault_tpm_token_ttl | vault_tpm_seconds) if ((vault_tpm_token_ttl | string | length) > 0) else omit }}"
    token_max_ttl: "{{ (vault_tpm_token_max_ttl | vault_tpm_seconds) if ((vault_tpm_token_max_ttl | string | length) > 0) else omit }}"
    token_period: "{{ (vault_tpm_token_period | vault_tpm_seconds) if ((vault_tpm_token_period | string | length) > 0) else omit }}"
    token_type: "{{ vault_tpm_token_type if ((vault_tpm_token_type | string | length) > 0) else omit }}"
    token_bound_cidrs: "{{ vault_tpm_token_bound_cidrs if (vault_tpm_token_bound_cidrs | length > 0) else omit }}"
    tpmgroup_ids: "{{ vault_tpm_role_config.tpmgroup_ids | default(omit) }}"
    tpm_ids: "{{ _tpm_ids }}"
    state: present
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _existing_ids: "{{ (vault_tpm_auth_role_read.json.data.tpm_ids | default([])) if (vault_tpm_auth_role_read.status == 200) else [] }}"
    _config_ids: "{{ vault_tpm_role_config.tpm_ids | default([]) }}"
    _tpm_ids: "{{ (_existing_ids + _config_ids + [vault_tpm_identity.tpm_id]) | unique | list }}"
  no_log: true
  delegate_to: localhost
  become: false
