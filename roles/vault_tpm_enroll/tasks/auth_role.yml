---
# identity_tpm returns this host's id. tpm_role replaces the role body, so the
# write sends every field that should be kept. Retry because a parallel host
# can write the role between this host's read and write.

- name: Require a TPM id from enroll
  ansible.builtin.assert:
    that:
      - vault_tpm_identity.tpm_id | default('') | length > 0
    fail_msg: identity_tpm did not return a tpm_id.

- name: Append this TPM id until the auth role keeps it
  ansible.builtin.include_tasks: auth_role_write.yml
  vars:
    vault_tpm_role_attempt: 1

- name: Require the auth role to include this TPM
  ansible.builtin.assert:
    that:
      - vault_tpm_id_confirmed | bool
    fail_msg: >-
      Auth role {{ vault_tpm_role_name }} did not keep TPM id
      {{ vault_tpm_identity.tpm_id }} after repeated updates.
      Enroll one host at a time.
