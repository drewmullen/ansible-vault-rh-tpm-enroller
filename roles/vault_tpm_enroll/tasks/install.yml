---
- name: Install TPM packages
  ansible.builtin.package:
    name: "{{ vault_tpm_packages + (['swtpm'] if (vault_tpm_install_swtpm | bool) else []) }}"
    state: present
  become: true
  when: (vault_tpm_packages | length > 0) or (vault_tpm_install_swtpm | bool)

- name: Install python3-requests for hashicorp.vault.identity_tpm
  ansible.builtin.package:
    name: python3-requests
    state: present
  become: true

- name: Install the Vault binary
  ansible.builtin.import_role:
    name: vault_tpm_common
    tasks_from: install_vault.yml
  vars:
    vault_tpm_binary_action: enrolling
