---
argument_specs:
  main:
    short_description: Enroll a host TPM and attach it to a TPM auth role
    description:
      - Enrolls a host TPM and appends its id to an existing auth role's tpm_ids.
      - Does not enable the auth mount, write auth/tpm/config, or write ACL policy.
    options:
      vault_tpm_api_addr:
        type: str
        required: false
        description:
          - Vault address the controller uses. Defaults to VAULT_ADDR. Must start with https://.
      vault_tpm_host_addr:
        type: str
        required: false
        description:
          - Vault address the host uses for vault tpm enroll. Defaults to vault_tpm_api_addr.
      vault_tpm_token:
        type: str
        required: false
        no_log: true
        description:
          - Admin token. Defaults to VAULT_TOKEN. Required unless AppRole is set.
      vault_tpm_role_id:
        type: str
        required: false
        description:
          - AppRole role id used when vault_tpm_token is empty.
      vault_tpm_secret_id:
        type: str
        required: false
        no_log: true
        description:
          - AppRole secret id used when vault_tpm_token is empty.
      vault_tpm_role_name:
        type: str
        required: true
        description:
          - Name of auth/<mount>/role/<name>. The role must be allowed to reference policies that already exist.
      vault_tpm_token_policies:
        type: list
        elements: str
        required: true
        description:
          - Policy names attached to the auth role. The policies must already exist.
      vault_tpm_auth_path:
        type: str
        required: false
        default: tpm
        description:
          - TPM auth mount path. The mount must already be enabled.
      vault_tpm_namespace:
        type: str
        required: false
        default: ""
        description:
          - Vault namespace. Empty leaves the root namespace.
      vault_tpm_token_ttl:
        type: str
        required: false
        default: 1h
        description:
          - TTL of tokens the auth role issues.
      vault_tpm_token_max_ttl:
        type: str
        required: false
        default: ""
        description:
          - Max TTL. Empty omits the field.
      vault_tpm_token_period:
        type: str
        required: false
        default: ""
        description:
          - Token period. Empty omits the field.
      vault_tpm_token_type:
        type: str
        required: false
        default: ""
        description:
          - service, batch, or default. Empty omits the field.
      vault_tpm_token_no_default_policy:
        type: bool
        required: false
        default: false
        description:
          - When true, issued tokens do not receive the default policy.
      vault_tpm_token_bound_cidrs:
        type: list
        elements: str
        required: false
        default: []
        description:
          - CIDRs bound to issued tokens.
      vault_tpm_role_config:
        type: dict
        required: false
        default: {}
        description:
          - Extra keys merged onto the auth role body.
      vault_tpm_enroll_name:
        type: str
        required: false
        description:
          - Name passed to vault tpm enroll. Defaults to inventory_hostname.
      vault_tpm_device_path:
        type: str
        required: false
        default: /dev/tpmrm0
        description:
          - TPM device path.
      vault_tpm_enroll_metadata:
        type: dict
        required: false
        default: {}
        description:
          - Metadata passed as repeated -metadata flags.
      vault_tpm_ca_cert:
        type: str
        required: false
        default: ""
        description:
          - Vault CA PEM text. Required unless vault_tpm_ca_cert_src is set.
      vault_tpm_ca_cert_src:
        type: str
        required: false
        default: ""
        description:
          - Path of the Vault CA file on the controller.
      vault_tpm_ca_cert_dest:
        type: str
        required: false
        default: /etc/vault-tpm/ca.pem
        description:
          - Path of the CA file on the host.
      vault_tpm_packages:
        type: list
        elements: str
        required: false
        description:
          - TPM packages to install.
      vault_tpm_install_swtpm:
        type: bool
        required: false
        default: false
        description:
          - Install and start swtpm before enroll.
      vault_tpm_version:
        type: str
        required: false
        default: ""
        description:
          - Vault version to install. Empty requires a binary at vault_tpm_bin_path.
      vault_tpm_bin_path:
        type: str
        required: false
        default: /usr/local/bin/vault
        description:
          - Path of the vault binary.
